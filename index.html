<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Tiny Explorers — a living-world exploration game for young children."
  />

  <title>Tiny Explorers</title>

  <style>
    /* =========================================================
       TINY EXPLORERS — PROMOTIONAL SITE
       Purpose:
       Public promotional experience for the Tiny Explorers concept.
       Final promotional copy will be added only after approval.
       ========================================================= */

    :root {
      --sky-top: #77d8f4;
      --sky-bottom: #dff7ff;

      --cream: #fff9e9;
      --cream-deep: #f9edcd;

      --purple: #6544a5;
      --purple-dark: #443075;
      --pink: #ef75a8;
      --coral: #f38a76;
      --yellow: #ffd75a;
      --green: #72c779;
      --blue: #55bddd;

      --ink: #382f4c;
      --ink-soft: #675d78;
      --white: #ffffff;

      --shadow-soft:
        0 12px 30px rgba(63, 46, 92, 0.14);

      --shadow-deep:
        0 22px 55px rgba(48, 35, 76, 0.20);

      --radius-large: 34px;
      --radius-medium: 24px;

      --page-width: 1380px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;

      color: var(--ink);
      background:
        radial-gradient(
          circle at 12% 10%,
          rgba(255, 255, 255, 0.95) 0,
          rgba(255, 255, 255, 0) 24%
        ),
        linear-gradient(
          180deg,
          var(--sky-top) 0%,
          var(--sky-bottom) 38%,
          var(--cream) 72%,
          #fffdf7 100%
        );

      font-family:
        "Trebuchet MS",
        "Segoe UI",
        Arial,
        sans-serif;
    }

    button,
    a {
      font: inherit;
    }

    a {
      color: inherit;
    }

    img,
    video {
      display: block;
      max-width: 100%;
    }

    /* ---------- Background atmosphere ---------- */

    .world-atmosphere {
      position: fixed;
      inset: 0;
      z-index: -10;
      pointer-events: none;
      overflow: hidden;
    }

    .cloud {
      position: absolute;
      width: 190px;
      height: 58px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.55);
      filter: blur(0.4px);
      animation: drift 30s linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: inherit;
    }

    .cloud::before {
      width: 82px;
      height: 82px;
      left: 35px;
      top: -35px;
    }

    .cloud::after {
      width: 105px;
      height: 105px;
      right: 24px;
      top: -52px;
    }

    .cloud-one {
      top: 16%;
      left: -220px;
    }

    .cloud-two {
      top: 55%;
      left: -300px;
      transform: scale(0.7);
      opacity: 0.55;
      animation-duration: 43s;
      animation-delay: -18s;
    }

    @keyframes drift {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(calc(100vw + 500px));
      }
    }

    /* ---------- Navigation ---------- */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 18px 24px 0;
    }

    .nav-shell {
      width: min(var(--page-width), calc(100% - 20px));
      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;

      padding: 12px 18px;

      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 999px;

      background: rgba(255, 249, 233, 0.82);

      box-shadow:
        0 8px 25px rgba(55, 42, 80, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;

      text-decoration: none;
      font-size: 1.12rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      white-space: nowrap;
    }

    .brand-star {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      border-radius: 50%;
      background:
        linear-gradient(145deg, #ffe783, #ffc848);

      color: var(--purple);
      font-size: 1.35rem;

      box-shadow:
        0 6px 13px rgba(135, 95, 34, 0.20),
        inset 0 2px 2px rgba(255, 255, 255, 0.75);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .nav-link {
      position: relative;

      border: 0;
      border-radius: 999px;
      padding: 11px 17px;

      color: var(--ink-soft);
      background: transparent;

      font-weight: 800;
      text-decoration: none;

      cursor: pointer;

      transition:
        transform 180ms ease,
        background 180ms ease,
        color 180ms ease,
        box-shadow 180ms ease;
    }

    .nav-link:hover {
      transform: translateY(-2px);
      color: var(--purple-dark);
      background: rgba(255, 255, 255, 0.72);
    }

    .nav-link.active {
      color: #fff;
      background:
        linear-gradient(135deg, var(--purple), #7f5ec2);

      box-shadow:
        0 7px 16px rgba(82, 57, 129, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.24);
    }

    /* ---------- Pages ---------- */

    .page {
      display: none;
      min-height: calc(100vh - 90px);
      animation: pageIn 480ms ease both;
    }

    .page.active {
      display: block;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .page-inner {
      width: min(var(--page-width), calc(100% - 44px));
      margin: 0 auto;
    }

    /* =========================================================
       PAGE 1 — TINY EXPLORERS
       ========================================================= */

    .hero {
      min-height: calc(100vh - 92px);

      display: grid;
      align-items: center;

      padding: 48px 0 72px;
    }

    .hero-stage {
      position: relative;
      isolation: isolate;

      width: 100%;
      padding: 28px 28px 40px;

      border-radius: 46px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.72),
          rgba(255, 248, 226, 0.48)
        );

      border: 1px solid rgba(255, 255, 255, 0.82);

      box-shadow:
        var(--shadow-deep),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .hero-stage::before {
      content: "";
      position: absolute;
      inset: 14px;
      z-index: -1;

      border-radius: 38px;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(255, 222, 112, 0.28),
          transparent 46%
        );
    }

    .hero-title-area {
      text-align: center;
      padding: 5px 20px 28px;
    }

    .hero-kicker {
      margin: 0 0 4px;

      color: var(--purple);
      font-size: clamp(0.82rem, 1.4vw, 1rem);
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .hero-title {
      margin: 0;

      font-size: clamp(3.4rem, 8vw, 7.7rem);
      line-height: 0.92;
      letter-spacing: -0.065em;

      color: var(--purple-dark);

      text-shadow:
        0 4px 0 rgba(255, 255, 255, 0.9),
        0 12px 24px rgba(78, 53, 120, 0.13);
    }

    .hero-title span {
      color: var(--pink);
    }

    .hero-video-wrap {
      position: relative;

      width: min(1120px, 100%);
      margin: 0 auto;

      padding: 10px;

      border-radius: 34px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.95),
          rgba(255, 225, 149, 0.62)
        );

      box-shadow:
        0 25px 60px rgba(51, 37, 73, 0.24),
        0 7px 0 rgba(84, 59, 118, 0.10);

      transform:
        perspective(1400px)
        rotateX(1.2deg);
    }

    .hero-video-wrap::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: -25px;
      height: 35px;
      z-index: -1;

      border-radius: 50%;
      background: rgba(62, 47, 77, 0.18);
      filter: blur(15px);
    }

    .hero-video {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;

      border-radius: 26px;
      background: #281f36;
    }

    .hero-character {
      position: absolute;
      z-index: 6;

      pointer-events: none;

      filter:
        drop-shadow(0 18px 16px rgba(46, 33, 62, 0.20));

      transition:
        transform 400ms cubic-bezier(.2,.8,.2,1);
    }

    .hero-diana {
      width: clamp(125px, 14vw, 230px);
      right: -20px;
      bottom: -30px;

      transform:
        perspective(900px)
        rotateY(-4deg);
    }

    .hero-buddy {
      width: clamp(90px, 9vw, 145px);
      left: -5px;
      bottom: -14px;

      transform:
        perspective(900px)
        rotateY(5deg);
    }

    .hero-stage:hover .hero-diana {
      transform:
        perspective(900px)
        rotateY(-4deg)
        translateY(-7px);
    }

    .hero-stage:hover .hero-buddy {
      transform:
        perspective(900px)
        rotateY(5deg)
        translateY(-4px);
    }

    /* ---------- Contact / Comments ---------- */

    .contact-section {
      padding: 55px 0 105px;
    }

    .contact-shell {
      position: relative;
      overflow: hidden;

      padding: clamp(28px, 5vw, 62px);

      border-radius: 42px;

      background:
        linear-gradient(
          135deg,
          rgba(255, 244, 199, 0.95),
          rgba(255, 219, 230, 0.93) 52%,
          rgba(220, 238, 255, 0.94)
        );

      box-shadow: var(--shadow-soft);

      border: 1px solid rgba(255, 255, 255, 0.9);
    }

    .contact-shell::before {
      content: "";
      position: absolute;
      width: 330px;
      height: 330px;
      right: -100px;
      top: -150px;

      border-radius: 50%;
      background: rgba(255, 255, 255, 0.30);
    }

    .contact-choice-row {
      position: relative;
      z-index: 1;

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;

      max-width: 900px;
      margin: 0 auto;
    }

    .contact-choice {
      min-height: 160px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 0;
      border-radius: 30px;

      color: var(--ink);
      background: rgba(255, 255, 255, 0.78);

      box-shadow:
        0 15px 30px rgba(67, 47, 89, 0.12),
        inset 0 1px 0 #fff;

      font-size: clamp(1.3rem, 2.5vw, 2rem);
      font-weight: 900;

      cursor: pointer;

      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        background 180ms ease;
    }

    .contact-choice:hover {
      transform:
        translateY(-7px)
        scale(1.015);

      background: #fff;

      box-shadow:
        0 23px 40px rgba(67, 47, 89, 0.18),
        inset 0 1px 0 #fff;
    }

    /* =========================================================
       PAGE 2 — EXPLORE THE WORLD
       ========================================================= */

    .explore-page {
      padding: 62px 0 110px;
    }

    .explore-header {
      text-align: center;
      margin-bottom: 52px;
    }

    .page-title {
      margin: 0;

      font-size: clamp(2.7rem, 6vw, 5.5rem);
      line-height: 0.95;
      letter-spacing: -0.055em;

      color: var(--purple-dark);

      text-shadow:
        0 3px 0 rgba(255, 255, 255, 0.8);
    }

    .adventure-stream {
      display: grid;
      gap: 58px;
    }

    .adventure-card {
      position: relative;

      width: min(1120px, 100%);
      margin: 0 auto;

      padding: 10px;

      border-radius: 34px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.94),
          rgba(255, 244, 215, 0.74)
        );

      box-shadow:
        0 20px 48px rgba(58, 42, 80, 0.17),
        0 6px 0 rgba(83, 62, 110, 0.08);

      transition:
        transform 250ms ease,
        box-shadow 250ms ease;
    }

    .adventure-card:nth-child(odd) {
      transform:
        perspective(1500px)
        rotateY(0.8deg);
    }

    .adventure-card:nth-child(even) {
      transform:
        perspective(1500px)
        rotateY(-0.8deg);
    }

    .adventure-card:hover {
      transform:
        perspective(1500px)
        translateY(-7px)
        scale(1.008);

      box-shadow:
        0 29px 62px rgba(58, 42, 80, 0.22),
        0 8px 0 rgba(83, 62, 110, 0.08);
    }

    .adventure-video {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;

      border-radius: 26px;
      background: #2d243a;
    }

    /* =========================================================
       PAGE 3 — ABOUT THE PROJECT
       Content deliberately withheld until approved.
       ========================================================= */

    .about-page {
      padding: 62px 0 110px;
    }

    .about-top {
      text-align: center;
      margin-bottom: 62px;
    }

    .about-visual-field {
      min-height: 330px;

      position: relative;
      overflow: hidden;

      display: grid;
      place-items: center;

      margin-top: 38px;

      border-radius: 42px;

      background:
        radial-gradient(
          circle at 50% 10%,
          rgba(255, 255, 255, 0.95),
          rgba(255, 244, 210, 0.80) 42%,
          rgba(225, 236, 255, 0.82)
        );

      border: 1px solid rgba(255, 255, 255, 0.88);

      box-shadow: var(--shadow-soft);
    }

    .about-diana {
      width: clamp(160px, 22vw, 285px);

      filter:
        drop-shadow(0 22px 20px rgba(52, 37, 70, 0.20));

      animation: gentleFloat 4s ease-in-out infinite;
    }

    .about-buddy {
      position: absolute;
      width: clamp(95px, 11vw, 145px);

      right: 15%;
      bottom: 25px;

      filter:
        drop-shadow(0 16px 16px rgba(52, 37, 70, 0.18));

      animation:
        gentleFloat 4.5s ease-in-out infinite -1.5s;
    }

    @keyframes gentleFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-7px);
      }
    }

    /* ---------- Parents section ---------- */

    .parents-section {
      margin-top: 90px;
      padding-top: 68px;

      border-top:
        2px dashed rgba(101, 68, 165, 0.20);
    }

    .parents-heading {
      text-align: center;
      margin-bottom: 42px;
    }

    .parent-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 24px;
    }

    .parent-card {
      position: relative;

      padding: 10px;

      border-radius: 28px;

      background: rgba(255, 255, 255, 0.88);

      box-shadow:
        0 16px 34px rgba(54, 42, 73, 0.13);

      transition:
        transform 200ms ease,
        box-shadow 200ms ease;
    }

    .parent-card:nth-child(1) {
      transform: rotate(-0.6deg);
    }

    .parent-card:nth-child(2) {
      transform: rotate(0.5deg);
    }

    .parent-card:nth-child(3) {
      transform: rotate(0.4deg);
    }

    .parent-card:nth-child(4) {
      transform: rotate(-0.5deg);
    }

    .parent-card:hover {
      transform:
        rotate(0)
        translateY(-5px);

      box-shadow:
        0 22px 45px rgba(54, 42, 73, 0.18);
    }

    .parent-card img {
      width: 100%;
      height: auto;

      border-radius: 20px;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 820px) {
      .site-header {
        padding: 10px 10px 0;
      }

      .nav-shell {
        width: 100%;
        padding: 9px 10px;
        gap: 8px;
      }

      .brand {
        font-size: 0;
        gap: 0;
      }

      .brand-star {
        width: 38px;
        height: 38px;
        font-size: 1.15rem;
      }

      .nav-links {
        flex: 1;
        justify-content: flex-end;
        gap: 3px;
      }

      .nav-link {
        padding: 9px 10px;
        font-size: 0.78rem;
      }

      .page-inner {
        width: min(100% - 24px, var(--page-width));
      }

      .hero {
        min-height: auto;
        padding: 28px 0 48px;
      }

      .hero-stage {
        padding: 22px 12px 34px;
        border-radius: 30px;
      }

      .hero-title-area {
        padding-bottom: 20px;
      }

      .hero-video-wrap {
        padding: 6px;
        border-radius: 23px;
      }

      .hero-video {
        border-radius: 18px;
      }

      .hero-diana {
        right: -20px;
        bottom: -42px;
        width: 120px;
      }

      .hero-buddy {
        left: -15px;
        bottom: -28px;
        width: 82px;
      }

      .contact-section {
        padding: 35px 0 70px;
      }

      .contact-shell {
        padding: 22px 16px;
        border-radius: 28px;
      }

      .contact-choice-row {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .contact-choice {
        min-height: 105px;
      }

      .explore-page,
      .about-page {
        padding-top: 38px;
      }

      .adventure-stream {
        gap: 30px;
      }

      .adventure-card {
        padding: 6px;
        border-radius: 23px;
      }

      .adventure-video {
        border-radius: 17px;
      }

      .parent-grid {
        grid-template-columns: 1fr;
      }

      .about-buddy {
        right: 7%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- Decorative atmosphere generated in CSS only. -->
  <div class="world-atmosphere" aria-hidden="true">
    <div class="cloud cloud-one"></div>
    <div class="cloud cloud-two"></div>
  </div>

  <!-- =======================================================
       SITE NAVIGATION
       ======================================================= -->
  <header class="site-header">
    <nav class="nav-shell" aria-label="Main navigation">

      <a
        class="brand"
        href="#tiny-explorers"
        data-page-link="home"
        aria-label="Tiny Explorers home"
      >
        <span class="brand-star">★</span>
        <span>Tiny Explorers</span>
      </a>

      <div class="nav-links">

        <button
          class="nav-link active"
          type="button"
          data-page-link="home"
        >
          Tiny Explorers
        </button>

        <button
          class="nav-link"
          type="button"
          data-page-link="explore"
        >
          Explore the World
        </button>

        <button
          class="nav-link"
          type="button"
          data-page-link="about"
        >
          About the Project
        </button>

      </div>
    </nav>
  </header>


  <main>

    <!-- =====================================================
         PAGE 1 — TINY EXPLORERS
         ===================================================== -->
    <section
      id="page-home"
      class="page active"
      data-page="home"
    >
      <div class="page-inner">

        <div class="hero">

          <div class="hero-stage">

            <div class="hero-title-area">
              <p class="hero-kicker">
                A Living World for Little Explorers
              </p>

              <h1 class="hero-title">
                Tiny <span>Explorers</span>
              </h1>
            </div>

            <div class="hero-video-wrap">

              <video
                class="hero-video"
                src="assets/Game_Promo_Video.mp4"
                autoplay
                muted
                loop
                playsinline
                preload="metadata"
                aria-label="Tiny Explorers promotional video"
              ></video>

              <img
                class="hero-character hero-diana"
                src="assets/characters/Diana_01.png"
                alt=""
                aria-hidden="true"
              />

              <img
                class="hero-character hero-buddy"
                src="assets/characters/Buddy_01.png"
                alt=""
                aria-hidden="true"
              />

            </div>
          </div>
        </div>


        <!-- Contact / Comments belongs on the HOME page. -->
        <section
          id="contact"
          class="contact-section"
          aria-label="Contact and comments"
        >
          <div class="contact-shell">

            <div class="contact-choice-row">

              <button
                class="contact-choice"
                type="button"
                data-contact-type="parent"
              >
                Parent
              </button>

              <button
                class="contact-choice"
                type="button"
                data-contact-type="other"
              >
                Other
              </button>

            </div>

          </div>
        </section>

      </div>
    </section>


    <!-- =====================================================
         PAGE 2 — EXPLORE THE WORLD
         ===================================================== -->
    <section
      id="page-explore"
      class="page"
      data-page="explore"
    >
      <div class="page-inner explore-page">

        <header class="explore-header">
          <h2 class="page-title">
            Explore the World
          </h2>
        </header>

        <div class="adventure-stream">

          <article class="adventure-card">
            <video
              class="adventure-video"
              src="assets/adventures/Home_Scenes_Morning-Routine.mp4"
              muted
              loop
              playsinline
              preload="metadata"
            ></video>
          </article>

          <article class="adventure-card">
            <video
              class="adventure-video"
              src="assets/adventures/Little-Town_Games.mp4"
              muted
              loop
              playsinline
              preload="metadata"
            ></video>
          </article>

          <article class="adventure-card">
            <video
              class="adventure-video"
              src="assets/adventures/Forest_Adventure.mp4"
              muted
              loop
              playsinline
              preload="metadata"
            ></video>
          </article>

          <article class="adventure-card">
            <video
              class="adventure-video"
              src="assets/adventures/Ocean_Adventure.mp4"
              muted
              loop
              playsinline
              preload="metadata"
            ></video>
          </article>

          <article class="adventure-card">
            <video
              class="adventure-video"
              src="assets/adventures/Transport_Adventure.mp4"
              muted

  <script>
    /* =========================================================
       TINY EXPLORERS — SITE BEHAVIOR
       ========================================================= */

    const pages = document.querySelectorAll("[data-page]");
    const pageLinks = document.querySelectorAll("[data-page-link]");
    const adventureVideos =
      document.querySelectorAll(".adventure-video");

    function showPage(pageName, updateHash = true) {
      pages.forEach((page) => {
        page.classList.toggle(
          "active",
          page.dataset.page === pageName
        );
      });

      pageLinks.forEach((link) => {
        link.classList.toggle(
          "active",
          link.dataset.pageLink === pageName
        );
      });

      if (updateHash) {
        const hashes = {
          home: "#tiny-explorers",
          explore: "#explore",
          about: "#about"
        };

        history.replaceState(
          null,
          "",
          hashes[pageName] || "#tiny-explorers"
        );
      }

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

      if (pageName !== "explore") {
        adventureVideos.forEach((video) => {
          video.pause();
        });
      }
    }


    pageLinks.forEach((link) => {
      link.addEventListener("click", (event) => {
        event.preventDefault();

        showPage(link.dataset.pageLink);
      });
    });


    /* Play Explore videos only when they are actually visible.
       This keeps ten MP4 files from hammering the browser at once. */

    const videoObserver =
      new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            const video = entry.target;

            if (
              entry.isIntersecting &&
              entry.intersectionRatio >= 0.35
            ) {
              video.play().catch(() => {});
            } else {
              video.pause();
            }
          });
        },
        {
          threshold: [0, 0.35, 0.75]
        }
      );

    adventureVideos.forEach((video) => {
      videoObserver.observe(video);
    });


    /* Initial page from URL hash. */

    const initialHash =
      window.location.hash.toLowerCase();

    if (initialHash === "#explore") {
      showPage("explore", false);
    } else if (initialHash === "#about") {
      showPage("about", false);
    } else {
      showPage("home", false);
    }


    /* Contact actions intentionally have no form behavior yet.
       Final contact method will be wired after we approve it. */

    document
      .querySelectorAll("[data-contact-type]")
      .forEach((button) => {
        button.addEventListener("click", () => {
          const type =
            button.dataset.contactType;

          console.log(
            `Tiny Explorers contact selected: ${type}`
          );
        });
      });

  </script>
